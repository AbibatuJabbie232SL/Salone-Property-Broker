<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Properties | Salone Property Brokers</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body data-page="properties"><main>
<div class="pg"><div class="w"><h1>Find properties across Sierra Leone.</h1><p>Search by location, budget and property type to find your starting point.</p>
<form class="fbox" id="f" role="search"><div><label for="q">Search</label><input id="q" name="q" type="search" placeholder="Location or property title"></div><div><label for="l">Location</label><select id="l" name="loc"><option value="">All locations</option><option>Freetown</option><option>Western Area</option></select></div><div><label for="m">Buy / rent</label><select id="m" name="m"><option value="">Any purpose</option><option value="sale">Buy</option><option value="rent">Rent</option></select></div><div><label for="t">Property type</label><select id="t" name="type"><option value="">All types</option><option>House</option><option>Apartment</option><option>Land</option></select></div><div><label for="x">Max budget</label><select id="x" name="max"><option value="">No maximum</option><option value="500">500</option><option value="1000">1,000</option><option value="150000">150,000</option><option value="250000">250,000</option></select></div><div><label for="bd">Bedrooms</label><select id="bd" name="beds"><option value="">Any</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option></select></div><input type="hidden" name="sort" id="sortv"></form>
<p class="note">USD example prices. Rent is per month. <a href="#" id="clr"><b>Clear filters</b></a></p><p class="note">Example listings and prices are fictional. Images are illustrative, not proof of any property.</p></div></div>
<section style="padding-top:8px"><div class="w"><div class="tools"><div><h2 id="cnt" style="margin:0"></h2></div><div><div class="seg" role="group" aria-label="View"><button class="on" data-v="list">List</button><button data-v="map">Map</button></div><label for="so" style="margin:0">Sort by</label><select id="so" onchange="document.getElementById('sortv').value=this.value;document.getElementById('f').dispatchEvent(new Event('input'))"><option value="">Newest listings</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select></div></div><div class="grid" id="res"></div><div class="map" id="map"></div></div></section>
</main><script src="app.js"></script></body></html>
